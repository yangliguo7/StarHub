<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="StarHub - Professional GitHub Stars Management">
  <meta name="theme-color" content="#1a1a1a">
  <title>StarHub - GitHub Stars Manager</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script>
    // Initialize theme before Vue app loads
    (function() {
      const theme = localStorage.getItem('app-theme') || 'dark';
      localStorage.setItem('app-theme', theme);
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.body.classList.toggle('dark', theme === 'dark');
      const themeColor = theme === 'dark' ? '#1a1a1a' : '#ffffff';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = themeColor;
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
